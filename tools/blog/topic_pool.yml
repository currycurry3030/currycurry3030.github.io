# 스탠포드 시리즈 외 주제 풀.
# next_topic.py 가 위에서부터 미사용 항목을 하나씩 꺼낸다.
# 주제가 떨어지면 발행이 멈추므로(조용한 실패 없음) 분기마다 보충한다.
#
# 각 항목:
#   key          : 슬러그 겸 중복 방지 키 (영문 소문자·하이픈)
#   title        : 초안 제목 씨앗 (에이전트가 다듬어도 됨)
#   question     : 이 글이 답해야 할 단 하나의 질문
#   must_include : 반드시 들어가야 할 구체 요소 (추상론 방지)
#   source       : 근거를 가져올 로컬 경로 (있으면)

agentops:
  - key: cron-failure-modes
    title: "에이전트 크론 8개를 한 달 굴리며 실제로 깨진 것들"
    question: "정기 실행 에이전트 작업은 어디서 조용히 죽는가?"
    must_include:
      - "systemd-run user scope 생성 실패 사례와 원인"
      - "암호화 XLSX 복호화가 'Wrong password'로 실패한 케이스"
      - "실패를 알아채는 장치(로그 위치, 알림 경로)가 없으면 생기는 일"
      - "재시도/알림 설계 권장안"
    source: "~/.hermes/cron/output"

  - key: skill-library-entropy
    title: "스킬 153개는 자산이 아니라 부채가 된다"
    question: "에이전트 스킬 라이브러리는 몇 개부터 관리 비용이 효용을 넘는가?"
    must_include:
      - "일괄 유입된 스킬과 실제로 반복 사용된 스킬의 사용 횟수 격차"
      - "사용 빈도 측정 방법"
      - "아카이브 기준과 복구 가능한 아카이브 구조"
    source: "~/.hermes/skills"

  - key: agent-secret-handling
    title: "에이전트에게 비밀값을 다루게 할 때의 최소 설계"
    question: "자동화 에이전트가 토큰·비밀번호를 만지게 하되 유출은 막는 구조는?"
    must_include:
      - "코드가 아닌 별도 경로에 secret을 두는 이유"
      - "git 추적 제외와 로그 마스킹"
      - "발행물 자동 스캔으로 사후 방어선 하나 더 두기"

  - key: multi-agent-shared-browser
    title: "여러 에이전트가 브라우저 하나를 공유할 때 생기는 문제"
    question: "동일 세션 브라우저를 병렬 에이전트가 쓰면 무엇이 충돌하는가?"
    must_include:
      - "탭 상태를 전제하지 않고 먼저 확인해야 하는 이유"
      - "중복 작업 방지 패턴"
      - "CDP 기반 제어의 제약"

  - key: handoff-between-sessions
    title: "세션이 끊겨도 작업이 이어지게 만드는 핸드오프 문서"
    question: "컨텍스트가 사라진 뒤 다음 세션이 즉시 재개하려면 무엇이 적혀 있어야 하나?"
    must_include:
      - "핸드오프에 반드시 들어갈 항목 목록"
      - "비밀값이 새지 않게 하는 규칙"
      - "검증 명령을 함께 적어야 하는 이유"

  - key: model-fallback-chain
    title: "모델 폴백 체인을 실제로 설계해 보니"
    question: "쿼터 소진·장애 시 자동 전환을 어떻게 구성해야 작업이 안 끊기나?"
    must_include:
      - "작업 성격별 모델 배치 기준"
      - "크론 작업에 모델을 고정해야 하는 이유"
      - "폴백이 조용히 품질을 떨어뜨릴 때의 신호"

data:
  - key: export-parser-contract
    title: "가계부 내보내기 파서는 계약으로 다뤄야 한다"
    question: "외부 서비스의 내보내기 포맷이 바뀌면 파이프라인은 어떻게 깨지고, 어떻게 막나?"
    must_include:
      - "컬럼 스키마 검증을 적재 전에 두는 구조"
      - "합성 예시 데이터 (실제 금액 금지)"
      - "조용한 오분류가 리포트를 어떻게 왜곡하는지"

  - key: public-data-name-matching
    title: "공공데이터와 민간 데이터를 붙일 때 이름 매칭이 제일 어렵다"
    question: "같은 대상을 가리키는 서로 다른 표기를 어떻게 안전하게 잇는가?"
    must_include:
      - "오매칭이 만들어내는 잘못된 결론의 예"
      - "정규화 규칙과 수동 매핑 테이블의 역할 분담"
      - "매칭 실패를 조용히 버리지 않고 드러내는 방법"

  - key: idempotent-ingest
    title: "매일 도는 적재 작업을 멱등하게 만드는 법"
    question: "같은 작업이 두 번 돌아도 데이터가 망가지지 않으려면?"
    must_include:
      - "중복 감지 키 설계"
      - "state 파일 vs DB unique 제약 비교"
      - "재실행 테스트 방법"

  - key: weekly-report-design
    title: "주간 리포트는 숫자가 아니라 변화량을 보여줘야 한다"
    question: "자동 생성 리포트를 사람이 계속 읽게 만들려면 무엇을 담아야 하나?"
    must_include:
      - "전주 대비 델타를 기본 단위로 두는 이유"
      - "이상치만 올리는 필터 설계"
      - "메신저 전달 포맷 제약(길이·미리보기)"

  - key: scraping-vs-api
    title: "DOM 스크래핑 대신 네트워크 캡처를 먼저 보라"
    question: "SPA에서 데이터를 가져올 때 왜 DOM 파싱이 가장 나쁜 선택인가?"
    must_include:
      - "DOM 구조 변경으로 깨진 실제 사례"
      - "네트워크 탭에서 실제 API를 찾는 절차"
      - "약관·robots 확인이 선행되어야 하는 이유"

  - key: synthetic-data-for-public-writing
    title: "개인 데이터를 쓰지 않고 데이터 글을 쓰는 방법"
    question: "실제 데이터를 공개할 수 없을 때 글의 설득력을 어떻게 유지하나?"
    must_include:
      - "분포는 유지하고 값은 바꾸는 합성 기법"
      - "익명화가 실패하는 전형적 패턴"
      - "합성 데이터임을 독자에게 밝히는 표기"
