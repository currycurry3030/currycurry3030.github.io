name: "CI"

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # for posts' lastmod

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build assets
        run: npm ci && npm run build

      - name: Lint styles
        run: npm test

      - name: Validate Stanford study data
        run: python3 tools/validate_stanford_study.py

      - name: Build and test site
        run: bash tools/test
