# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# GitHub Pages user site
baseurl: ""

# UI/content locale. Chirpy falls back to English for labels that are not localized.
lang: ko-KR

timezone: Asia/Seoul

# jekyll-seo-tag settings
# ↓ --------------------------

title: AI Engineering Notes
tagline: LLM · Agents · Data Science · Learning

description: >-
  Personal notes and learning projects about AI engineering, LLMs, agents,
  evaluation, data science, and practical system design.

url: "https://currycurry3030.github.io"

github:
  username: currycurry3030

twitter:
  username:

social:
  name: currycurry3030
  email:
  links:
    - https://github.com/currycurry3030

google_site_verification:

# ↑ --------------------------
# The end of `jekyll-seo-tag` settings

google_analytics:
  id:

# Prefer color scheme setting. Empty follows the system preference.
theme_mode:

# Keep empty unless a separate image CDN is configured.
img_cdn:

# Optional sidebar avatar.
avatar:

# Global table of contents switch.
toc: true

comments:
  active:
  disqus:
    shortname:
  utterances:
    repo:
    issue_term:
  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping:
    input_position:
    lang:
    reactions_enabled:

assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: true

paginate: 10

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/
  - scope:
      path: assets/img/favicons
    values:
      swcache: true
  - scope:
      path: assets/js/dist
    values:
      swcache: true

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - tools
  - README.md
  - CHANGELOG.md
  - LICENSE
  - rollup.config.js
  - node_modules
  - package*.json

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
